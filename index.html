<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diêm Điện 3D</title>
<style>
:root{--ink:#f0d9c0;--red:#b3261a;--gold:#d4aa55;box-sizing:border-box}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.chips button{min-height:36px;font-size:13px;padding:0 12px}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(10,0,0,.88);padding:20px}

#bm{display:none}

.inf{font-size:10px;margin:4px 0 0;opacity:.6}#chips{display:none}#chips.on{display:flex}

#map{inset:auto;right:8px;top:calc(8px + env(safe-area-inset-top,0px));width:110px;height:110px;border:1px solid #7a2a22;border-radius:8px;z-index:3;opacity:.92}
